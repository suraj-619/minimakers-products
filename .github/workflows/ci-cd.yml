name: MiniMakers Products CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore
      run: dotnet restore MiniMakers.Products.slnx

    - name: Build
      run: dotnet build MiniMakers.Products.slnx --no-restore --configuration Release
